name: Snapshot injections

# Keeps a Git history (readable diffs) of the authored JS published in /injections.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Snapshot live /injections.json
        env:
          LIVE_ORIGIN: ${{ vars.LIVE_ORIGIN }}
        run: node tools/snapshot-injections.mjs
      - name: Commit if changed
        run: |
          git add injections-history
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git config user.name "injections-snapshot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "chore(injections): snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
