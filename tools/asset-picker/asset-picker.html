<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AEM Assets Picker</title>
  <script src="https://experience.adobe.com/solutions/CQ-assets-selectors/static-assets/resources/assets-selectors.js"></script>
  <style>
    :root { --bg:#fff; --fg:#2c2c2c; --muted:#6e6e6e; --line:#e1e1e1; --accent:#1473e6; --accent-fg:#fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--fg); background: var(--bg); font-size: 14px;
      display: flex; flex-direction: column; height: 100vh;
    }
    /* Controller (small da.live panel) */
    .pad { padding: 16px; }
    .lead { line-height: 1.5; color: var(--muted); margin: 0 0 14px; }
    button.primary {
      font: inherit; cursor: pointer; width: 100%; padding: 10px 12px;
      border-radius: 8px; border: 1px solid var(--accent);
      background: var(--accent); color: var(--accent-fg); font-weight: 600;
    }
    button.primary:disabled { opacity: .5; cursor: default; }
    .note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
    /* Popup (full window) */
    #selector { flex: 1; min-height: 0; }
    #dbg {
      font: 11px ui-monospace, Menlo, monospace; color: var(--muted);
      border-top: 1px solid var(--line); padding: 5px 10px; white-space: pre-wrap;
      max-height: 90px; overflow: auto; background: rgba(127,127,127,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1f1f1f; --fg:#e8e8e8; --muted:#9a9a9a; --line:#3a3a3a; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="dbg"></div>

  <script type="module">
    const $dbg = document.getElementById('dbg');
    const dbg = (m) => { $dbg.innerHTML += `${m}\n`; try { console.log('[asset-picker]', m); } catch {} };
    window.addEventListener('error', (e) => dbg(`err: ${e.message}`));
    window.addEventListener('unhandledrejection', (e) => dbg(`rej: ${e.reason?.message || e.reason}`));

    const isPopup = new URLSearchParams(location.search).get('mode') === 'popup';

    // ---- shared helpers --------------------------------------------------
    function decodeJwt(t) {
      try {
        const p = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(decodeURIComponent(escape(atob(p))));
      } catch { return {}; }
    }
    const BASE = '/adobe/assets';
    const RENDITION_REL = 'http://ns.adobe.com/adobecloud/rel/rendition';
    const seo = (n) => (n && n.includes('.') ? n.split('.').slice(0, -1).join('.') : (n || ''));
    const isImage = (a) => (a.mimetype || a['dc:format'] || '').toLowerCase().startsWith('image/');
    const esc = (s = '') => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function altOf(a) {
      const meta = a._embedded && a._embedded['http://ns.adobe.com/adobecloud/rel/metadata/asset'];
      return (meta && (meta['Iptc4xmpExt:ExtDescrAccessibility'] || meta['dc:description'] || meta['dc:title']))
        || (a['dc:title'] && (a['dc:title']['o:default'] || a['dc:title']))
        || a.name || '';
    }

    // Authenticated AEM binary URL for an asset (original preferred, then a rendition).
    function binarySourceUrl(a) {
      const host = a['repo:repositoryId'];
      const assetId = a['repo:assetId'] || a['repo:id'];
      const dampath = a['repo:path'] || a.path;
      // /adobe/assets/<id> returns the asset binary directly (filename-independent, verified).
      if (host && assetId) return `https://${host}${BASE}/${assetId}`;
      if (host && dampath) return `https://${host}${dampath}`;
      const rend = a._links && a._links[RENDITION_REL];
      if (Array.isArray(rend) && rend[0] && rend[0].href) return rend[0].href;
      if (rend && rend.href) return rend.href;
      return '';
    }
    function extFor(mime, name) {
      let ext = (mime && mime.split('/')[1]) || (name && name.includes('.') ? name.split('.').pop() : '') || 'jpg';
      ext = ext.toLowerCase().split('+')[0];
      return ext === 'jpeg' ? 'jpg' : ext;
    }
    function slugName(name) {
      return (seo(name) || 'image').replace(/[^a-z0-9-]+/gi, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'image';
    }

    // =====================================================================
    // POPUP MODE: full-size window that renders the Assets Selector.
    // Receives the token from its opener, posts the picked HTML back.
    // =====================================================================
    if (isPopup) {
      document.getElementById('root').innerHTML = '<div id="selector" style="height:100vh"></div>';
      const $selector = document.getElementById('selector');
      let imsToken = null;
      let ctx = null; // { org, repo, path } of the doc being edited

      // Fetch the asset binary from AEM (authenticated), upload it into the
      // doc's media sidecar via the da.live Source API, and return the
      // renderable src the server assigns (e.g. ./media_<hash>.jpg). This is
      // the same media-bus path da.live uses for drag-and-drop, so the image
      // is served publicly with no AEM runtime dependency.
      async function importAsset(a) {
        const binUrl = binarySourceUrl(a);
        if (!binUrl) throw new Error('no binary url');
        dbg(`fetch: ${binUrl.replace(/^https?:\/\//, '').slice(0, 64)}…`);
        const bres = await fetch(binUrl, { headers: { Authorization: `Bearer ${imsToken}` } });
        if (!bres.ok) throw new Error(`AEM fetch ${bres.status}`);
        const blob = await bres.blob();
        if (!ctx || !ctx.org || !ctx.repo || !ctx.path) throw new Error('no doc context');
        const ref = ctx.ref || 'main';
        const parent = ctx.path.replace(/\/[^/]*$/, '');
        const docname = ctx.path.split('/').pop();
        const ext = extFor(blob.type, a['repo:name'] || a.name);
        const file = `${slugName(a['repo:name'] || a.name)}.${ext}`;
        const webPath = `${parent}/.${docname}/${file}`;        // helix path (no org/repo)
        const srcPath = `/${ctx.org}/${ctx.repo}${webPath}`;    // da-admin source path

        // 1) upload the binary into the doc's media sidecar.
        const fd = new FormData();
        fd.append('data', new Blob([blob], { type: blob.type || `image/${ext}` }));
        const ures = await fetch(`https://admin.da.live/source${srcPath}`, {
          method: 'POST', headers: { Authorization: `Bearer ${imsToken}` }, body: fd,
        });
        if (!ures.ok) throw new Error(`da upload ${ures.status}`);
        let uj = {};
        try { uj = await ures.json(); } catch { /* may be empty */ }
        const contentUrl = (uj.source && uj.source.contentUrl) || uj.contentUrl || '';

        // 2) preview the media so helix content-addresses it, then insert the
        // relative ./media_<hash> src — it renders both in the editor (Canvas
        // rewrites it to the preview origin) and on the published page.
        try {
          const pres = await fetch(`https://admin.hlx.page/preview/${ctx.org}/${ctx.repo}/${ref}${webPath}`, {
            method: 'POST', headers: { Authorization: `Bearer ${imsToken}` },
          });
          if (pres.ok) {
            const pj = await pres.json();
            const rl = (pj.preview && pj.preview.redirectLocation) || '';
            const m = rl.match(/media_[0-9a-f]+\.[a-z0-9]+$/i);
            if (m) { dbg(`media → ./${m[0]}`); return `./${m[0]}`; }
            dbg('no redirectLocation in preview');
          } else { dbg(`preview ${pres.status}`); }
        } catch (e) { dbg(`preview err: ${e.message}`); }

        // Fallback: the content.da.live source URL. It still localizes to the
        // media bus when the doc is published, but may show broken in-editor.
        if (contentUrl) { dbg(`fallback → ${contentUrl}`); return contentUrl; }
        throw new Error('no renderable src');
      }

      async function handleSelection(assets) {
        const list = Array.isArray(assets) ? assets : [assets];
        const parts = [];
        for (const a of list) {
          if (!isImage(a)) { dbg(`skip non-image: ${a.name || ''}`); continue; }
          try {
            const src = await importAsset(a);
            if (src) parts.push(`<p><img src="${esc(src)}" alt="${esc(altOf(a))}"></p>`);
          } catch (err) { dbg(`import failed: ${err.message}`); }
        }
        const html = parts.join('');
        if (html && window.opener) {
          window.opener.postMessage({ pickedHtml: html }, '*');
          window.close();
          return;
        }
        // Nothing imported — keep this window open so the log stays readable.
        dbg('— no image inserted; window kept open. Check the log above.');
      }

      function render(token) {
        imsToken = token;
        const claims = decodeJwt(token);
        const props = {
          imsToken: token,
          imsClientId: claims.client_id,
          imsScope: claims.scope,
          aemTierType: ['delivery', 'author'],
          colorScheme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
          handleSelection,
          onClose: () => window.close(),
        };
        if (claims.org) props.imsOrg = claims.org;
        dbg(`popup render: clientId=${props.imsClientId}, doc=${ctx ? `${ctx.org}/${ctx.repo}${ctx.path}` : '(no ctx)'}`);
        try { window.PureJSSelectors.renderAssetSelector($selector, props); }
        catch (e) { dbg(`render threw: ${e.message}`); }
      }

      window.addEventListener('message', (e) => {
        if (e.data && e.data.token) {
          if (e.data.ctx) ctx = e.data.ctx;
          render(e.data.token);
        }
      });
      // Ask the opener (the da.live panel iframe) for the token + doc context.
      if (window.opener) window.opener.postMessage({ pickerReady: true }, '*');
      else dbg('no opener — open this from the da.live panel.');

    // =====================================================================
    // CONTROLLER MODE: small da.live panel. Handshake with da.live, show a
    // button that opens the big popup, relay the picked asset into the doc.
    // =====================================================================
    } else {
      let daPort = null;
      let daToken = null;
      let daCtx = null;
      let popup = null;

      document.getElementById('root').innerHTML = `
        <div class="pad">
          <p class="lead">Browse AEM Assets and insert images into the document.</p>
          <button class="primary" id="browse" disabled>Browse AEM Assets…</button>
          <p class="note">The selected image is copied into this document's media and inserted at your cursor.</p>
        </div>`;
      const $browse = document.getElementById('browse');

      // da.live handshake
      window.addEventListener('message', (e) => {
        if (e.data && e.data.ready) {
          daToken = e.data.token || null;
          daCtx = e.data.context || e.data.project || null;
          if (e.ports && e.ports[0]) daPort = e.ports[0];
          dbg(`da.live: port=${!!daPort}, token=${daToken ? 'yes' : 'no'}, doc=${daCtx ? `${daCtx.org}/${daCtx.repo || daCtx.site}${daCtx.path}` : '?'}`);
          $browse.disabled = !daToken;
          if (!daToken) $browse.textContent = 'No AEM session (sign in to da.live)';
        }
        // messages from the popup
        if (e.data && e.data.pickerReady && popup) {
          const ctx = daCtx ? { org: daCtx.org, repo: daCtx.repo || daCtx.site, path: daCtx.path } : null;
          popup.postMessage({ token: daToken, ctx }, '*');
        }
        if (e.data && e.data.pickedHtml && daPort) {
          daPort.postMessage({ action: 'sendHTML', details: e.data.pickedHtml });
          dbg('inserted selection into doc');
        }
      });

      $browse.addEventListener('click', () => {
        if (!daToken) return;
        // Cache-bust so the popup always loads the current build (the opener
        // and popup are the same file; a stale cached popup runs old code).
        const url = `${location.pathname}?mode=popup&v=${Date.now()}`;
        popup = window.open(url, 'aem-asset-picker', 'width=1200,height=820,resizable=yes,scrollbars=yes');
        if (!popup) dbg('popup blocked — allow popups for da.live');
      });
    }
  </script>
</body>
</html>
